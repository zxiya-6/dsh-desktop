name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux 冒烟测试：真实启动内核、验证终端/shell 检测、切换/回滚、插件通道
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system deps (Electron + pty + headless X)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 \
            xvfb dbus-x11

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Smoke — terminal & shell detection (no kernel)
        run: npm run smoke:terminal

      - name: Smoke — phase2 (registry meta, proxies, lock)
        run: xvfb-run -a npx electron --no-sandbox -- scripts/smoke-phase2.js

      - name: Seed kernel snapshot (real pnpm install of dsh)
        run: xvfb-run -a npx electron --no-sandbox -- scripts/seed-core.js 0.1.5-rc.1

      - name: Smoke — kernel boots from userData with token URL
        run: xvfb-run -a npx electron --no-sandbox -- scripts/smoke-kernel.js

      - name: Smoke — switch success/failure paths (config never poisoned)
        run: xvfb-run -a npx electron --no-sandbox -- scripts/smoke-switch.js

      - name: Smoke — plugin store isolation (install via dsh plugin into dsh-home)
        run: xvfb-run -a npx electron --no-sandbox -- scripts/smoke-plugins.js

  build:
    needs: [test-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux build deps (deb tooling)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-${{ github.ref_name }}-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/latest*.yml
